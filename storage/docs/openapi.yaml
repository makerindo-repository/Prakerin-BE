components:
  securitySchemes:
    SanctumBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Use the token provided after login to access protected routes.

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      description: The ID of the resource
      schema:
        type: string

    PageParam:
      name: page
      in: query
      required: false
      allowEmptyValue: false
      description: Page number for pagination
      schema:
        type: integer
        example: 1
        minimum: 1   
    LimitParam:
      name: limit
      in: query
      required: false
      allowEmptyValue: false
      description: Number of items per page for pagination
      schema:
        type: integer
        example: 10
        minimum: 1
    SearchParam:
      name: search
      in: query
      required: false
      allowEmptyValue: true
      description: Search term for filtering results
      schema:
        type: string
    IsVerifiedParam:
      name: is_verified
      in: query
      required: false
      allowEmptyValue: true
      description: Filter for verified status
      schema:
        type: boolean
    IsAcceptedParam:
      name: is_accepted
      in: query
      required: false
      allowEmptyValue: true
      description: Filter for accepted status
      schema:
        type: boolean
    ProvinceIdParam:
      name: province_id
      in: query
      required: false
      allowEmptyValue: true
      description: Search by ID for filtering results
      schema:
        type: string
    RoleParam:
      name: role
      in: query
      required: false
      allowEmptyValue: true
      description: Filter by user role
      schema:
        type: string
        enum:
          - student
          - school
          - company
          - super_admin
    CityRegencyIdParam:
      name: city_regency_id
      in: query
      required: false
      allowEmptyValue: true
      description: Filter by city regency ID
      schema:
        type: string
    TypeOfEducationParam:
      name: type
      in: query
      required: false
      allowEmptyValue: true
      description: Filter by type
      schema:
        type: string
        enum:
          - internship
          - job_opening
          - both

  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: string
                example: "Unauthorized."
    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: string
                example: "Not found."
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: string
                example: "Forbidden."

  schemas:
    
    # User
    UserRegisterRequest:
      type: object
      required:
        - username
        - email
        - password
        - password_confirmation
        - role
        - recaptcha_token
        - name
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
        password_confirmation:
          type: string
        role:
          type: string
          enum: 
            - "student"
            - "school"
            - "company"
        recaptcha_token:
          type: string
        name:
          type: string
        image:
          type: string
          format: binary
        address:
          type: string
        school_id:
          type: integer
    UserLoginRequest:
      type: object
      required:
        - email
        - password
        - recaptcha_token
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        recaptcha_token:
          type: string
          description: Token for reCAPTCHA verification
    UserUpdateRequest:
      type: object
      required:
        - _method
      properties:
        _method:
          type: string
          enum: 
            - "PATCH"
        username:
          type: string
          pattern: '^[a-zA-Z0-9._]+$'
        email:
          type: string
          format: email
        password:
          type: string
        password_confirmation:
          type: string
        image:
          type: string
          format: binary
        name:
          type: string
          maxLength: 255
        address:
          type: string
        phone_number:
          type: string
          pattern: '^(?:\+62|0)[0-9]{9,13}$'
        school_id:
          type: string
          format: uuid
        date_of_birth:
          type: string
          format: date
        gender:
          type: string
          enum:
            - "male"
            - "female"
        city_regency_id:
          type: string
          format: uuid
        sector_id:
          type: string
          format: uuid
    UserCreateRequest:
      type: object
      required:
        - username
        - email
        - password
        - password_confirmation
        - role
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
        password_confirmation:
          type: string
        role:
          type: string
          enum: 
            - "student"
            - "school"
            - "company"
            - "super_admin"
        name:
          type: string
        image:
          type: string
          format: binary
        address:
          type: string
        school_id:
          type: integer

    # Sector
    SectorCreateRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        is_accepted:
          type: boolean
    SectorUpdateRequest:
      type: object
      properties:
        name:
          type: string
        is_accepted:
          type: boolean

    # Province
    ProvinceCreateRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        is_accepted:
          type: boolean
    ProvinceUpdateRequest:
      type: object
      properties:
        name:
          type: string
        is_accepted:
          type: boolean

    # City Regency
    CityRegencyCreateRequest:
      type: object
      required:
        - name
        - province_id
      properties:
        name:
          type: string
        province_id:
          type: string
        is_accepted:
          type: boolean
    CityRegencyUpdateRequest:
      type: object
      properties:
        name:
          type: string
        province_id:
          type: string
        is_accepted:
          type: boolean
          
    # Field
    FieldCreateRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        is_accepted:
          type: boolean
    FieldUpdateRequest:
      type: object
      properties:
        name:
          type: string
        is_accepted:
          type: boolean

   
    # Internship

    # Company

    # Curriculum Vitae
    CurriculumVitaeCreateRequest:
      type: object
      required:
        - name
        - file
      properties:
        name:
          type: string
        file:
          type: string
          format: binary
    CurriculumVitaeUpdateRequest:
      type: object
      required:
        - _method
      properties:
        _method:
          type: string
          enum: 
            - "PATCH"
        name:
          type: string
        file:
          type: string
          format: binary

