      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
  /curriculum-vitaes/{id}/preview:
    get:
      security:
        - SanctumBearerAuth: []
      summary: Preview a curriculum vitae by ID
      operationId: previewCurriculumVitaeById
      tags:
