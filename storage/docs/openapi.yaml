openapi: 3.1.0
info:
  title: PrakerinID API
  description: Dokumentation API for PrakerinID application
  version: 1.0.0
  contact:
    name: PrakerinID Team
    email: ranggadendi6@gmail.com

servers:
  - url: http://localhost:8000/api
    description: Local development server

tags:
  - name: User
    description: Operations related to user management
  - name: Sector
    description: Operations related to sector management
  - name: Province
    description: Operations related to province management
  - name: City Regency
    description: Operations related to city regency management
  - name: Student
    description: Operations related to student management
  - name: School
    description: Operations related to school management
  - name: Internship
    description: Operations related to internship management
  - name: Company
    description: Operations related to company management
paths:
  # User
  /users/register:
    post: 
      summary: User registration
      operationId: userRegister
      tags:
        - User
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserRegisterRequest'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  role:
                    type: string
                    enum: 
                      - student
                      - school
                      - industry
                      - super_admin
  /users/login:
    post:
      summary: User login
      operationId: userLogin
      tags:
        - User
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  role:
                    type: string
                    enum: 
                      - student
                      - school
                      - industry
                      - super_admin
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: string
                    example: "Email or password wrong!"               
  /users/logout:
    post:
      security:
        - SanctumBearerAuth: []
      summary: User logout
      operationId: userLogout
      tags:
        - User
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Logout successful"
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users:
    get:
      security:
        - SanctumBearerAuth: []
      summary: User Profile
      operationId: userProfile
      tags:
        - User
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      username:
                        type: string
                      email:
                        type: string
                        format: email
                      role:
                        type: string
                        enum: 
                          - student
                          - school
                          - industry
                          - super_admin
                      email_verified_at:
                        type: string
                        format: date-time
                      created_at:
                        type: string
                        format: date-time
                      updated_at:
                        type: string
                        format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
  
  # Sector
  /sectors:
    get:
      summary: Get all sectors
      operationId: getAllSectors
      security:
        - SanctumBearerAuth: []
      tags:
        - Sector
      parameters:
        - $ref: '#/components/parameters/SearchParam'
        - $ref: '#/components/parameters/IsAcceptedParam'
      responses:
        '200':
          description: OK
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      security:
        - SanctumBearerAuth: []
      summary: Create a new sector
      operationId: createSector
      tags:
        - Sector
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SectorCreateRequest'
      responses:
        '201':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /sectors/{id}:
    patch:
      security:
        - SanctumBearerAuth: []
      summary: Update a sector
      operationId: updateSector
      tags:
        - Sector
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                is_accepted:
                  type: boolean
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      security:
        - SanctumBearerAuth: []
      summary: Delete a sector
      operationId: deleteSector
      tags:
        - Sector
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
  
  # Province
  /provinces:
    get:
      security:
        - SanctumBearerAuth: []
      summary: Get all provinces
      operationId: getAllProvinces
      tags:
        - Province
      parameters:
        - $ref: '#/components/parameters/SearchParam'
        - $ref: '#/components/parameters/IsAcceptedParam'
      responses:
        '200':
          description: OK
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      security:
        - SanctumBearerAuth: []
      summary: Create a new province
      operationId: createProvince
      tags:
        - Province
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProvinceCreateRequest'
      responses:
        '201':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /provinces/{id}:
    patch:
      security:
        - SanctumBearerAuth: []
      summary: Update a province
      operationId: updateProvince
      tags:
        - Province
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProvinceUpdateRequest'
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      security:
        - SanctumBearerAuth: []
      summary: Delete a province
      operationId: deleteProvince
      tags:
        - Province
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'

  # City Regency
  /city-regencies:
    get:
      security:
        - SanctumBearerAuth: []
      summary: Get all city regencies
      operationId: getAllCityRegencies
      tags:
        - City Regency
      parameters:
        - $ref: '#/components/parameters/SearchParam'
        - $ref: '#/components/parameters/IsAcceptedParam'
        - $ref: '#/components/parameters/ProvinceIdParam'
      responses:
        '200':
          description: OK
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      security:
        - SanctumBearerAuth: []
      summary: Create a new city regency
      operationId: createCityRegency
      tags:
        - City Regency
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CityRegencyCreateRequest'
      responses:
        '201':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /city-regencies/{id}:
    patch:
      security:
        - SanctumBearerAuth: []
      summary: Update a city regency
      operationId: updateCityRegency
      tags:
        - City Regency
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CityRegencyUpdateRequest'
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      security:
        - SanctumBearerAuth: []
      summary: Delete a city regency
      operationId: deleteCityRegency
      tags:
        - City Regency
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'


  /students:
    get:
      security:
        - SanctumBearerAuth: []
      summary: Get all students
      operationId: getAllStudents
      tags:
        - Student
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/SearchParam'
        - $ref: '#/components/parameters/IsVerifiedParam'
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      security:
        - SanctumBearerAuth: []
      summary: Create a new student
      operationId: createStudent
      tags:
        - Student
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StudentCreateRequest'
      responses:
        '201':
          description: Created
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /students/{id}:
    get:
      security:
        - SanctumBearerAuth: []
      summary: Get a student
      operationId: getStudent
      tags:
        - Student
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: The ID of the student to get
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      security:
        - SanctumBearerAuth: []
      summary: Update a student
      operationId: updateStudent
      tags:
        - Student
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: The ID of the student to update
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StudentUpdateRequest'
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      security: 
        - SanctumBearerAuth: []
      summary: Delete a student
      operationId: deletetudent
      tags:
        - Student
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: The ID of the student to delete
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "OK"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
  /students/count:
    get:
      security:
        - SanctumBearerAuth: []
      summary: Get total number of students
      operationId: getStudentCount
      tags:
        - Student
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # Company
  /companies:
    get:
      security:
        - SanctumBearerAuth: []
      summary: Get all companies
      operationId: getAllCompanies
      tags:
        - Company
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/SearchParam'
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /companies/{id}:
    get:
      security:
        - SanctumBearerAuth: []
      summary: Get a company
      operationId: getCompany
      tags:
        - Company
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: The ID of the company to get
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
  /companies/count:
    get:
      security:
        - SanctumBearerAuth: []
      summary: Get total number of companies
      operationId: getCompanyCount
      tags:
        - Company
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'


  # Internship
  /internships/count:
    get:
      security:
        - SanctumBearerAuth: []
      summary: Get total number of internships
      operationId: getInternshipCount
      tags:
        - Internship
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    SanctumBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Use the token provided after login to access protected routes.

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
      type: string
      description: The ID of the resource

    PageParam:
      name: page
      in: query
      required: false
      allowEmptyValue: false
      description: Page number for pagination
      schema:
        type: integer
        example: 1
        minimum: 1   
    LimitParam:
      name: limit
      in: query
      required: false
      allowEmptyValue: false
      description: Number of items per page for pagination
      schema:
        type: integer
        example: 10
        minimum: 1
    SearchParam:
      name: search
      in: query
      required: false
      allowEmptyValue: true
      description: Search term for filtering results
      schema:
        type: string
    IsVerifiedParam:
      name: is_verified
      in: query
      required: false
      allowEmptyValue: true
      description: Filter for verified status
      schema:
        type: boolean
    IsAcceptedParam:
      name: is_accepted
      in: query
      required: false
      allowEmptyValue: true
      description: Filter for accepted status
      schema:
        type: boolean
    ProvinceIdParam:
      name: province_id
      in: query
      required: false
      allowEmptyValue: true
      description: Search by ID for filtering results
      schema:
        type: string

  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: string
                example: "Unauthorized."
    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: string
                example: "Not found."
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: string
                example: "Forbidden."

  schemas:
    
    # User
    UserRegisterRequest:
      type: object
      required:
        - username
        - email
        - password
        - password_confirmation
        - role
        - recaptcha_token
        - name
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
        password_confirmation:
          type: string
        role:
          type: string
          enum: 
            - "student"
            - "school"
            - "industry"
        recaptcha_token:
          type: string
        name:
          type: string
        image:
          type: string
          format: binary
        address:
          type: string
        school_id:
          type: integer
    UserLoginRequest:
      type: object
      required:
        - email
        - password
        - recaptcha_token
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        recaptcha_token:
          type: string
          description: Token for reCAPTCHA verification

    # Sector
    SectorCreateRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        is_accepted:
          type: boolean
    SectorUpdateRequest:
      type: object
      properties:
        name:
          type: string
        is_accepted:
          type: boolean

    # Province
    ProvinceCreateRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        is_accepted:
          type: boolean
    ProvinceUpdateRequest:
      type: object
      properties:
        name:
          type: string
        is_accepted:
          type: boolean

    # City Regency
    CityRegencyCreateRequest:
      type: object
      required:
        - name
        - province_id
      properties:
        name:
          type: string
        province_id:
          type: string
        is_accepted:
          type: boolean
    CityRegencyUpdateRequest:
      type: object
      properties:
        name:
          type: string
        province_id:
          type: string
        is_accepted:
          type: boolean
          

    # Student
    StudentCreateRequest:
      type: object
      required:
        - username
        - email
        - password
        - password_confirmation
        - name
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
        password_confirmation:
          type: string
        name:
          type: string
        image:
          type: string
          format: binary
        school_id:
          type: integer
    StudentUpdateRequest:
      type: object
      required:
        - _method
      properties:
        _method:
          type: string
          enum: 
          - "PUT" 
          - "PATCH"
        name:
          type: string
        date_of_birth:
          type: string
          format: date
        gender:
          type: string
          enum:
            - "male"
            - "female"
        address:
          type: string
        image:
          type: string
          format: binary
        school_id:
          type: integer

    # Internship

    # Company
