openapi: 3.1.0
info:
  title: PrakerinID API
  description: Dokumentation API for PrakerinID application
  version: 1.0.0
  contact:
    name: PrakerinID Team
    email: ranggadendi6@gmail.com

servers:
  - url: http://localhost:8000/api/v1
    description: Local development server

tags:
  - name: User
    description: Operations related to user management
  - name: Curriculum Vitae
    description: Operations related to curriculum vitae management
  - name: Internship Application
    description: Operations related to internship application management
  - name: Job Opening
    description: Operations related to company management
  - name: Save Job Opening
    description: Operations related to save job opening management
  - name: Task
    description: Operations related to task management
  - name: Report Task
    description: Operations related to report task management
  - name: Feedback
    description: Operations related to feedback management
  - name: Certificate
    description: Operations related to certificate management
  - name: Company
    description: Operations related to company management
  - name: Sector
    description: Operations related to sector management
  - name: Province
    description: Operations related to province management
  - name: City Regency
    description: Operations related to city regency management
  - name: Field
    description: Operations related to field management
  - name: Student
    description: Operations related to student management
  - name: School
    description: Operations related to school management
  - name: Internship
    description: Operations related to internship management

paths:
  # User
  /users/register:
    post: 
      summary: User registration
      operationId: userRegister
      tags:
        - User
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserRegisterRequest'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  role:
                    type: string
                    enum: 
                      - student
                      - school
                      - company
                      - super_admin
  /users/login:
    post:
      summary: User login
      operationId: userLogin
      tags:
        - User
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  role:
                    type: string
                    enum: 
                      - student
                      - school
                      - company
                      - super_admin
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: string
                    example: "Email or password wrong!"               
  /users/logout:
    post:
      security:
        - SanctumBearerAuth: []
      summary: User logout
      operationId: userLogout
      tags:
        - User
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Logout successful"
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users:
    get:
      security:
        - SanctumBearerAuth: []
      summary: Get All User 
      operationId: userGetAll
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/SearchParam'
        - $ref: '#/components/parameters/IsVerifiedParam'
        - $ref: '#/components/parameters/RoleParam'
      tags:
        - User
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      security:
        - SanctumBearerAuth: []
      summary: Create User 
      operationId: createUser
      tags:
        - User
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '201':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /users/{id}:
    get:
      security:
        - SanctumBearerAuth: []
      summary: Get User by ID
      operationId: userGetById
      tags:
        - User
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      security:
        - SanctumBearerAuth: []
      summary: Update User by ID
      operationId: userUpdateById
      tags:
        - User
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      security:
        - SanctumBearerAuth: []
      summary: Delete User by ID
      operationId: userDeleteById
      tags:
        - User
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
  /users/profile:
    get:
      security:
        - SanctumBearerAuth: []
      summary: User Profile
      operationId: userProfile
      tags:
        - User
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      security:
        - SanctumBearerAuth: []
      summary: Update User Profile
      operationId: updateUserProfile
      tags:
        - User
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      security:
        - SanctumBearerAuth: []
      summary: Delete User Profile
      operationId: deleteUserProfile
      tags:
        - User
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'

