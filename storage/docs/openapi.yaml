openapi: 3.0.3
info:
  title: My Laravel API
  version: 1.0.0
paths:
  /api/users:
    get:
      summary: Get all users
      tags:
        - Users
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      example: 1
                    name:
                      type: string
                      example: Rangga
                    email:
                      type: string
                      example: rangga@example.com
